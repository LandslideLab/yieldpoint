name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Trusted publishing (OIDC): register the publisher on npm for this
      # repo + workflow, then npm gets a short-lived token automatically.
      # No NPM_TOKEN secret needed. See: LandslideLab/yieldpoint publish setup.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
